- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  notify: Restart audit service

- name: Restart audit service
  ansible.builtin.service:
    name: auditd
#    name: "{{ 'audit' if 'audit' in ansible_facts.packages else 'auditd' }}"
    enabled: true
    state: restarted
  ignore_errors: true