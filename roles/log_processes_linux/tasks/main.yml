- name: Determine audit package name
  ansible.builtin.package_facts:

- name: Install python3-libdnf5 for Ansible dnf module (Fedora/RHEL)
  ansible.builtin.command:
    cmd: dnf install -y python3-libdnf5
  register: libdnf_result
  changed_when: "'already installed' not in libdnf_result.stdout"
  when: ansible_pkg_mgr in ['dnf', 'yum']

- name: Install audit package if missing
  ansible.builtin.package:
    name: "{{ 'audit' if ansible_pkg_mgr in ['dnf', 'yum'] else 'auditd' }}"
    state: present

- name: Ensure execve audit rules are present (b32 + b64)
  ansible.builtin.blockinfile:
    path: "{{ rule_file }}"
    create: true
    owner: root
    group: root
    mode: "0640"
    marker: "# {mark} PROCESS AUDIT RULES"
    block: |
      -a always,exit -F arch=b32 -S execve -k {{ rule_key }}
      -a always,exit -F arch=b64 -S execve -k {{ rule_key }}
  notify: Load audit rules
