- name: Determine audit package name
  ansible.builtin.package_facts:

- name: Install audit package if missing
  ansible.builtin.package:
    name: "{{ 'audit' if 'audit' in ansible_facts.packages else 'auditd' }}"
    state: present

- name: Ensure execve audit rules are present (b32 + b64)
  ansible.builtin.copy:
    dest: "{{ rule_file }}"
    owner: root
    group: root
    mode: "0640"
    content: |
      -a exit,always -F arch=b32 -S execve -k {{ rule_key }}
      -a exit,always -F arch=b64 -S execve -k {{ rule_key }}
  notify: Load audit rules