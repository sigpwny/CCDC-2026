- name: Ensure Sigma alerts app directory exists
  ansible.builtin.file:
    path: "{{ splunk_home }}/etc/apps/{{ sigma_app_name }}/local"
    state: directory
    owner: splunk
    group: splunk
    mode: "0755"

- name: Deploy app.conf
  ansible.builtin.copy:
    dest: "{{ splunk_home }}/etc/apps/{{ sigma_app_name }}/default/app.conf"
    owner: splunk
    group: splunk
    mode: "0644"
    content: |
      [install]
      is_configured = true

      [ui]
      is_visible = true
      label = Sigma Detection Rules

      [launcher]
      description = Auto-converted Sigma detection rules for CCDC threat hunting
      version = 1.0.0
  notify: Restart Splunk

- name: Deploy Sigma saved searches
  ansible.builtin.copy:
    src: sigma-savedsearches.conf
    dest: "{{ splunk_home }}/etc/apps/{{ sigma_app_name }}/local/savedsearches.conf"
    owner: splunk
    group: splunk
    mode: "0644"
  notify: Restart Splunk
