- name: Remove nftables rules
  ansible.builtin.command: nft flush ruleset
  changed_when: false

- name: Open firewalld port for Splunk receiver
  ansible.posix.firewalld:
    port: "{{ splunk_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  ignore_errors: true

- name: Enable Splunk boot-start
  ansible.builtin.command:
    cmd: "{{ splunk_bin }} enable boot-start --accept-license --answer-yes --no-prompt -systemd-managed 0"
  register: boot_start_result
  changed_when: boot_start_result.rc == 0
  failed_when: false

- name: Ensure Splunk is started
  ansible.builtin.command:
    cmd: "{{ splunk_bin }} start --accept-license --answer-yes --no-prompt --run-as-root"
  register: splunk_start
  changed_when: "'already running' not in splunk_start.stdout"
  failed_when: splunk_start.rc != 0 and 'already running' not in splunk_start.stdout

- name: Ensure Splunk configs are present
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ splunk_home }}/etc/system/local/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { src: "indexes.conf.j2",       dest: "indexes.conf" }
    - { src: "splunk-inputs.conf.j2", dest: "inputs.conf" }
  notify: Restart Splunk

- name: Ensure TA staging directory exists
  ansible.builtin.file:
    path: /tmp/splunk_tas
    state: directory
    mode: "0755"

- name: Stage TA archives
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/splunk_tas/{{ item | basename }}"
    mode: "0644"
  loop: "{{ splunk_ta_archives }}"

- name: Install/Update TAs into etc/apps
  ansible.builtin.unarchive:
    src: "/tmp/splunk_tas/{{ item | basename }}"
    dest: "{{ splunk_home }}/etc/apps"
    remote_src: true
    owner: splunk
    group: splunk
  loop: "{{ splunk_ta_archives }}"
  notify: Restart Splunk

- name: Enable Splunk receiver on port {{ splunk_port }}
  ansible.builtin.command:
    cmd: "{{ splunk_bin }} enable listen {{ splunk_port }} -auth {{ splunk_user }}:{{ splunk_pass }}"
  register: enable_listen
  changed_when: "'already exists' not in enable_listen.stderr"
  failed_when: enable_listen.rc != 0 and 'already exists' not in enable_listen.stderr