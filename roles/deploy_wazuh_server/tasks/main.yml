- name: Check if Wazuh manager is installed
  ansible.builtin.stat:
    path: /var/ossec/bin/wazuh-control
  register: wazuh_installed

- name: Set Wazuh repo URL for Oracle Linux (RHEL)
  ansible.builtin.set_fact:
    wazuh_repo_url: "https://packages.wazuh.com/4.x/yum/"
  when: not wazuh_installed.stat.exists

- name: Add Wazuh GPG key
  ansible.builtin.rpm_key:
    key: "{{ wazuh_repo_key_url }}"
    state: present
  when: not wazuh_installed.stat.exists

- name: Add Wazuh repository
  ansible.builtin.yum_repository:
    name: wazuh
    description: Wazuh repository
    baseurl: "{{ wazuh_repo_url }}"
    gpgcheck: true
    gpgkey: "{{ wazuh_repo_key_url }}"
    enabled: true
  when: not wazuh_installed.stat.exists

- name: Install Wazuh manager
  ansible.builtin.yum:
    name: wazuh-manager
    state: present
    update_cache: true
  when: not wazuh_installed.stat.exists

- name: Deploy Wazuh manager configuration
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0640"
  notify: Restart wazuh-manager

- name: Enable and start Wazuh manager
  ansible.builtin.systemd:
    name: wazuh-manager
    enabled: true
    state: started

- name: Add Wazuh alerts to Splunk inputs
  ansible.builtin.blockinfile:
    path: "{{ splunk_home | default('/opt/splunkforwarder') }}/etc/system/local/inputs.conf"
    marker: "# {mark} WAZUH ALERTS"
    block: |
      [monitor://{{ wazuh_alerts_log }}]
      index = linux
      sourcetype = wazuh:alerts:json
      crcSalt = <SOURCE>
    create: true
  notify: Restart splunkforwarder
  ignore_errors: true

- name: Define hosts allowed to connect to Wazuh
  set_fact:
    wazuh_allowed_hosts: >
      {{
        groups['ecom']
        + groups['mail']
        + groups['dns']
        + groups['web']
        + groups['ftp']
        + groups['workstation']
        + groups['paloalto']
        + groups['vyos']
      }}

- name: Open Wazuh agent ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item.1 }}/tcp"
    source: "{{ hostvars[item.0]['ansible_host'] | default(item.0) }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ wazuh_allowed_hosts | product(['1514','1515','55000']) | list }}"
  when: inventory_hostname in groups['splunk']