- name: Ensure splunk group exists
  ansible.builtin.group:
    name: splunk
    system: true
    state: present

- name: Ensure splunk user exists
  ansible.builtin.user:
    name: splunk
    group: splunk
    home: "{{ install_dir }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Check if Splunk UF is installed
  ansible.builtin.stat:
    path: "{{ install_dir }}/bin/splunk"
  register: uf_bin

- name: Download UF installer to target (only if not installed)
  ansible.builtin.get_url:
    url: "{{ installer_url }}"
    dest: "{{ installer_dest }}"
    mode: "0644"
  when: not uf_bin.stat.exists

- name: Install Splunk UF (only if not installed)
  ansible.builtin.unarchive:
    src: "{{ installer_dest }}"
    dest: "{{ install_dir | dirname }}"
    remote_src: true
    creates: "{{ install_dir }}/bin/splunk"
  when: not uf_bin.stat.exists
  register: uf_extract

- name: Ensure install ownership/permissions
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    owner: splunk
    group: splunk
    recurse: true

- name: Ensure local config directory exists
  ansible.builtin.file:
    path: "{{ install_dir }}/etc/system/local"
    state: directory
    owner: splunk
    group: splunk
    mode: "0755"

- name: Seed admin credentials (first install only)
  ansible.builtin.copy:
    dest: "{{ install_dir }}/etc/system/local/user-seed.conf"
    owner: splunk
    group: splunk
    mode: "0600"
    content: |
      [user_info]
      USERNAME = {{ splunk_user }}
      PASSWORD = {{ splunk_pass }}
  when: uf_extract is changed

- name: Deploy inputs.conf
  ansible.builtin.copy:
    src: linux-inputs.conf
    dest: "{{ install_dir }}/etc/system/local/inputs.conf"
    owner: splunk
    group: splunk
    mode: "0640"
  notify: Restart splunkforwarder

- name: Deploy outputs.conf
  ansible.builtin.template:
    src: outputs.conf.j2
    dest: "{{ install_dir }}/etc/system/local/outputs.conf"
    owner: splunk
    group: splunk
    mode: "0640"
  notify: Restart splunkforwarder

- name: Deploy server.conf
  ansible.builtin.template:
    src: server.conf.j2
    dest: "{{ install_dir }}/etc/system/local/server.conf"
    owner: splunk
    group: splunk
    mode: "0640"
  notify: Restart splunkforwarder

- name: Ensure TA staging directory exists
  ansible.builtin.file:
    path: /tmp/splunk_tas
    state: directory
    mode: "0755"

- name: Stage TA archives
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/splunk_tas/{{ item | basename }}"
    mode: "0644"
  loop: "{{ linux_ta_archives }}"

- name: Install/Update TAs into etc/apps
  ansible.builtin.unarchive:
    src: "/tmp/splunk_tas/{{ item | basename }}"
    dest: "{{ install_dir }}/etc/apps"
    remote_src: true
    owner: splunk
    group: splunk
  loop: "{{ linux_ta_archives }}"
  notify: Restart splunkforwarder

- name: Deploy systemd unit
  ansible.builtin.template:
    src: splunkforwarder.service.j2
    dest: /usr/lib/systemd/system/splunkforwarder.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart splunkforwarder

- name: Ensure splunkforwarder enabled
  ansible.builtin.systemd:
    name: splunkforwarder
    enabled: true

- name: Remove installer (only if it was downloaded for install)
  ansible.builtin.file:
    path: "{{ installer_dest }}"
    state: absent
  when: not uf_bin.stat.exists