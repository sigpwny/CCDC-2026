- name: Configure advanced audit policy subcategory enforcement
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: SCENoApplyLegacyAuditPolicy
    data: "{{ 1 if force_subcategories else 0 }}"
    type: dword

- name: Enable process creation auditing (Event ID 4688)
  ansible.windows.win_audit_policy_system:
    subcategory: Process Creation
    audit_type: success

- name: Include command line in process creation events
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
    name: ProcessCreationIncludeCmdLine_Enabled
    data: 1
    type: dword