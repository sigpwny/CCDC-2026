- name: Set DNS Analytical max size (256MB)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-DNSServer/Analytical
    name: MaxSize
    data: 268435456
    type: dword

- name: Ensure MaxSizeUpper is 0
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-DNSServer/Analytical
    name: MaxSizeUpper
    data: 0
    type: dword

- name: Query channel state (wevtutil get-log)
  ansible.windows.win_command: >-
    wevtutil gl Microsoft-Windows-DNSServer/Analytical
  register: channel_gl
  changed_when: false

- name: Enable channel if disabled
  ansible.windows.win_command: >-
    wevtutil sl Microsoft-Windows-DNSServer/Analytical /e:true /rt:false /q:true
  when: "'enabled: false' in channel_gl.stdout | lower"